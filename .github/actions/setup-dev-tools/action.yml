name: 'Setup Development Tools'
description: 'Setup Python, Go, Rust, .NET, Node.js, and ESLint environments'
runs:
  using: "composite"
  steps:
    - name: Setup tool - Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup tool - Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Setup tool - Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy

    - name: Setup tool - .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup tool - Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Setup tool - ESLint
      shell: bash
      run: |
        # ESLint for pre-commit (repo: local)
        if [ -f package.json ]; then
            npm ci
            # Add node_modules/.bin to PATH
            echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
        else
            npm install -g eslint
        fi

    - name: Setup tool - Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.9.0'

    - name: Setup tool - TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: 'latest'
